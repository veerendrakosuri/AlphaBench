name: Build and push images

# Builds both Docker images and pushes them to GHCR (ghcr.io) whenever a version tag
# (v*) is pushed, so a git tag always has a corresponding, buildable image artifact --
# not just "whatever code happened to be live on Render at the time". Render's own
# deploy is separate and git-push-triggered; the two are complementary, not redundant:
# Render runs the services, GHCR keeps a portable, versioned image that isn't tied to
# any one PaaS and can be pulled and run anywhere `docker run` works.
#
# workflow_dispatch is included so the workflow can be exercised on demand without
# cutting a tag -- used to prove it actually builds and pushes before relying on it
# for a real release. A manual run tags images with the commit SHA only, never a
# version number, so a validation run can never be mistaken for a tagged release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/alphabench-api
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/alphabench-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "api_tags=${API_IMAGE}:${{ github.ref_name }},${API_IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "dashboard_tags=${DASHBOARD_IMAGE}:${{ github.ref_name }},${DASHBOARD_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            sha="sha-$(git rev-parse --short HEAD)"
            echo "api_tags=${API_IMAGE}:${sha}" >> "$GITHUB_OUTPUT"
            echo "dashboard_tags=${DASHBOARD_IMAGE}:${sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api_tags }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.dashboard_tags }}
