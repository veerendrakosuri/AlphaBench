project:
  name: alphabench
  seed: 42

data:
  start_date: "2010-01-01"
  end_date: null            # null = today
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

universe:
  file: config/universe_in.yaml   # primary market: India (NSE). US kept in
                                   # config/universe_us.yaml as the Week 9
                                   # generalisation-test market per PROPOSAL.md §3.1.
  benchmark: ^NSEI

target:
  horizons: [1, 5]
  deadband_kappa: 0.3
  vol_window: 20

validation:
  train_start: "2010-01-01"
  first_val_year: 2017
  last_val_year: 2023
  holdout_start: "2025-01-01"   # DO NOT TOUCH UNTIL WEEK 9
  purge_days: 5
  embargo_days: 5

backtest:
  commission_bps: 5.0
  slippage_bps: 5.0
  prob_threshold: 0.5164   # empirically calibrated: this model's OOF probabilities
                            # (h=1) range ~0.463-0.531 with almost all mass near 0.51-0.52.
                            # 0.5164 is that distribution's 90th percentile, so the strategy
                            # trades its most-confident ~10% of (date, symbol) rows rather
                            # than never trading at all.
  allow_short: false
  execution: next_open
