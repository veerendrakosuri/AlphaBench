repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # 60MB: features.parquet (~46MB) is the binding file. data/processed/** is
        # committed deliberately (see .gitignore's comment) so the deployed API never
        # depends on live yfinance; data/raw*/ and data/interim*/ stay fully ignored.
        args: [--maxkb=60000]
  - repo: local
    hooks:
      - id: no-notebook-output
        name: strip notebook outputs
        entry: jupyter nbconvert --clear-output --inplace
        language: system
        files: \.ipynb$
